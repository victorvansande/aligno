<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Aligno app icon, full bleed (iOS home screen, Android maskable).
       The mark stays inside the central safe zone (radius 205). -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8286FA"/>
      <stop offset=".55" stop-color="#5B5FEF"/>
      <stop offset="1" stop-color="#3E42C4"/>
    </linearGradient>
    <radialGradient id="hl" cx=".28" cy=".18" r=".75">
      <stop offset="0" stop-color="#fff" stop-opacity=".30"/>
      <stop offset=".65" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1B1D66" flood-opacity=".38"/>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <rect width="512" height="512" fill="url(#hl)"/>
  <g transform="translate(5 5)">
    <rect x="128" y="128" width="190" height="190" rx="54" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".78" stroke-width="22"/>
    <rect x="194" y="194" width="190" height="190" rx="54" fill="#fff" filter="url(#sh)"/>
    <path d="M289 251v76M251 289h76" stroke="#5B5FEF" stroke-width="22" stroke-linecap="round"/>
  </g>
</svg>
