<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Aligno icon for small sizes (browser tab, 16 to 32 px): the same mark,
       larger in the tile and with heavier lines, so it stays crisp when tiny.
       Rounded square without a margin: a tab has no room to spare. -->
  <rect width="512" height="512" rx="120" fill="#1C1C1E"/>
  <g transform="translate(256 256) scale(1.2) translate(-256 -256)">
    <rect x="133" y="133" width="190" height="190" rx="54" fill="#fff" fill-opacity=".16" stroke="#fff" stroke-opacity=".9" stroke-width="36" mask="url(#under)"/>
    <rect x="199" y="199" width="190" height="190" rx="54" fill="#fff" mask="url(#hole)"/>
    <mask id="under"><rect width="512" height="512" fill="#fff"/><rect x="199" y="199" width="190" height="190" rx="54" fill="#000"/></mask>
    <mask id="hole"><rect width="512" height="512" fill="#fff"/><path d="M336 336L254 254M254 254h66M254 254v66" fill="none" stroke="#000" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/></mask>
  </g>
</svg>
